# Fetches the latest CPSC recalls, builds the app and publishes it to GitHub Pages.
# Runs every day, on every push to main, and on demand from the Actions tab.
# If the CPSC API is down, the fetch step fails and the previous deploy stays live.
name: Refresh data and deploy

on:
  schedule:
    # 16:23 UTC, around midday Eastern, after the CPSC usually posts new recalls.
    - cron: "23 16 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch recalls from the CPSC
        # Two years is normally ~950 recalls. Far fewer means the API had a problem,
        # so fail rather than publish a nearly empty list.
        run: python fetch_recalls.py --min-count 100

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
